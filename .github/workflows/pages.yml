name: Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: site/.cache
          key: tlc-2024-01
      - run: pip install -e .
      - run: python site/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test in Chromium
        run: |
          npm install --no-save --prefix site/test playwright@1.49.1
          (cd site/test && npx playwright install chromium)
          (cd site/dist && python -m http.server 8000 &) && sleep 1
          NODE_PATH=site/test/node_modules node site/test/smoke.mjs http://localhost:8000/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
